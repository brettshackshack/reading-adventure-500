<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reading Warmup - 500 Point Challenge</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    font-family: Arial, Helvetica, sans-serif;
    background: linear-gradient(135deg, #7c3aed, #2563eb, #06b6d4);
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    color: #172033;
  }
  .game {
    width: min(900px, 100%);
    background: white;
    border-radius: 24px;
    padding: 28px;
    box-shadow: 0 18px 45px rgba(0,0,0,.22);
  }
  h1 { margin: 0 0 6px; text-align: center; font-size: 38px; }
  .subtitle { text-align: center; margin: 0 0 20px; color: #5b6475; }
  .stats {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 18px;
  }
  .stat {
    background: #f3f6ff;
    border-radius: 16px;
    padding: 14px;
    text-align: center;
    font-weight: 700;
  }
  .stat span { display:block; font-size: 25px; margin-top: 3px; }
  .level {
    display: inline-block;
    margin-bottom: 12px;
    background: #ede9fe;
    color: #5b21b6;
    padding: 8px 13px;
    border-radius: 999px;
    font-weight: 800;
  }
  .progress {
    height: 18px;
    background: #e5e7eb;
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .progress-bar {
    height: 100%;
    width: 0%;
    background: linear-gradient(90deg, #22c55e, #10b981);
    transition: width .35s ease;
  }
  .passage {
    background: #fff7ed;
    border: 2px solid #fed7aa;
    border-radius: 18px;
    padding: 20px;
    line-height: 1.7;
    font-size: 18px;
    margin-bottom: 18px;
  }
  .question { font-size: 23px; font-weight: 800; margin: 8px 0 15px; }
  .answers {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  button.answer {
    border: 2px solid #cbd5e1;
    background: white;
    border-radius: 16px;
    padding: 15px;
    font-size: 17px;
    text-align: left;
    cursor: pointer;
    transition: transform .15s, border-color .15s, background .15s;
  }
  button.answer:hover {
    transform: translateY(-2px);
    border-color: #6366f1;
    background: #f8faff;
  }
  button.answer.correct { background:#dcfce7; border-color:#22c55e; }
  button.answer.wrong { background:#fee2e2; border-color:#ef4444; }
  .message {
    min-height: 30px;
    font-weight: 800;
    text-align: center;
    margin-top: 16px;
    font-size: 18px;
  }
  .footer {
    margin-top: 18px;
    display:flex;
    justify-content:center;
    gap:10px;
  }
  .control {
    border: none;
    border-radius: 12px;
    padding: 11px 18px;
    font-weight: 800;
    cursor:pointer;
    background:#172033;
    color:white;
  }
  .hidden { display:none; }
  .complete {
    text-align:center;
    padding: 35px 15px;
  }
  .complete h2 { font-size: 34px; margin-bottom: 10px; }
  @media (max-width: 700px) {
    .stats, .answers { grid-template-columns: 1fr; }
    h1 { font-size: 30px; }
    .game { padding: 18px; }
  }
</style>
</head>
<body>
<div class="game">
  <h1>📚 Reading Warmup</h1>
  <p class="subtitle">Earn 500 points by showing what you know!</p>

  <div class="stats">
    <div class="stat">Points<span id="points">0</span></div>
    <div class="stat">Streak<span id="streak">0</span></div>
    <div class="stat">Questions<span id="count">1 / 10</span></div>
  </div>

  <div class="level" id="levelLabel">Level 1: Warm-Up</div>
  <div class="progress"><div class="progress-bar" id="progressBar"></div></div>

  <div id="gameArea">
    <div class="passage" id="passage"></div>
    <div class="question" id="question"></div>
    <div class="answers" id="answers"></div>
    <div class="message" id="message"></div>
  </div>

  <div id="complete" class="complete hidden">
    <h2>🎉 500 POINTS!</h2>
    <p>You finished the Reading Warmup. Great work!</p>
  </div>

  <div class="footer">
    <button class="control" onclick="resetGame()">🔄 Start Over</button>
  </div>
</div>

<script>
const DAILY_LIMIT = 500;
const POINTS_PER_CORRECT = 50;
const TOTAL_QUESTIONS = 10;
const questionBank = [{"level": 1, "title": "Warm-Up", "passage": "Maya packed her library book into her backpack before school. She had finished reading it the night before and was excited to return it and choose a new mystery book.", "question": "Why was Maya excited to go to the library?", "answers": ["She wanted to choose a new mystery book.", "She wanted to buy a backpack.", "She wanted to finish her homework.", "She wanted to meet her teacher."], "correct": 0}, {"level": 2, "title": "Getting Started", "passage": "The playground was wet after a long morning rain. Noah noticed that the clouds were finally breaking apart, so he put on his boots and walked outside to see whether the puddles were beginning to shrink.", "question": "What can the reader infer about the weather?", "answers": ["The rain is probably ending.", "A snowstorm is starting.", "The rain is getting heavier.", "The weather will stay dark all day."], "correct": 0}, {"level": 3, "title": "Think About It", "passage": "Lena practiced her speech in front of a mirror every evening. On the day of the presentation, her voice was still a little shaky, but she remembered to look at her audience and speak clearly.", "question": "Which character trait best describes Lena?", "answers": ["Determined", "Careless", "Impatient", "Forgetful"], "correct": 0}, {"level": 4, "title": "Reading Detective", "passage": "At first, the garden club's new vegetable patch looked like a pile of dirt. After several weeks of watering, weeding, and sunlight, tiny green leaves appeared. Soon, the students could see rows of lettuce and carrots growing.", "question": "What is the main idea of the passage?", "answers": ["Gardens can grow and change with care.", "Students dislike vegetables.", "Carrots grow faster than lettuce.", "Dirt is difficult to work with."], "correct": 0}, {"level": 5, "title": "Brain Power", "passage": "When the coach said the team had a mountain of work before the tournament, the players laughed. They knew he did not mean an actual mountain. He meant they had many difficult tasks to complete.", "question": "What does the phrase \u201ca mountain of work\u201d mean?", "answers": ["A very large amount of work", "Work on a mountain", "A short practice", "A fun outdoor activity"], "correct": 0}, {"level": 6, "title": "Expert Reader", "passage": "Jordan wanted to build a birdhouse. His first design leaned to one side, and the roof would not stay attached. Instead of giving up, he studied the instructions again, measured the wood more carefully, and rebuilt the house.", "question": "What lesson does the passage most strongly suggest?", "answers": ["Mistakes can help you improve when you keep trying.", "Building things is always easy.", "Instructions are never useful.", "Birdhouses should be very small."], "correct": 0}, {"level": 7, "title": "Reading Master", "passage": "The old oak tree stood at the edge of the field. Generations of students had played beneath its branches, and teachers sometimes used its wide shade for outdoor lessons. Although the tree never moved, it had become a familiar part of the school's history.", "question": "Why is the oak tree important to the school?", "answers": ["It connects many generations of students and teachers to the school.", "It is the newest tree on campus.", "It provides a place to store school supplies.", "It was planted last week."], "correct": 0}, {"level": 8, "title": "Challenge Reader", "passage": "Ava read an article about bees. She learned that bees carry pollen from flower to flower, helping many plants produce fruit and seeds. After reading, Ava understood that bees are important not only for making honey but also for healthy ecosystems.", "question": "What is the author's main purpose?", "answers": ["To explain why bees are important.", "To tell a funny story about a bee.", "To persuade readers to become beekeepers.", "To describe how to build a beehive."], "correct": 0}, {"level": 9, "title": "Deep Thinker", "passage": "Marcus had planned to spend Saturday playing video games, but his neighbor's puppy slipped through an open gate. Marcus followed the puppy down the sidewalk, carefully guided it away from the street, and helped return it home. By the time he finished, most of the afternoon was gone.", "question": "What can the reader infer about Marcus?", "answers": ["He is responsible and willing to help others.", "He dislikes animals.", "He never changes his plans.", "He was trying to lose the puppy."], "correct": 0}, {"level": 10, "title": "Reading Mastery", "passage": "During the science fair, Priya noticed that her plant-growth experiment produced different results from what she expected. Instead of hiding the unexpected results, she recorded every measurement, explained what happened, and suggested possible reasons for the difference. Her teacher praised her for treating the results honestly.", "question": "Which idea is best supported by the passage?", "answers": ["Good scientists pay attention to evidence, even when it surprises them.", "Scientists should change results to match predictions.", "Unexpected results mean an experiment should be ignored.", "Science fairs are only about winning prizes."], "correct": 0}];

let points = 0;
let streak = 0;
let currentLevel = 1;
let questionsAnswered = 0;
let questionAnswered = false;
let currentQuestion = null;
let usedIndexes = new Set();

const pointsEl = document.getElementById("points");
const streakEl = document.getElementById("streak");
const countEl = document.getElementById("count");
const levelLabelEl = document.getElementById("levelLabel");
const progressBarEl = document.getElementById("progressBar");
const passageEl = document.getElementById("passage");
const questionEl = document.getElementById("question");
const answersEl = document.getElementById("answers");
const messageEl = document.getElementById("message");
const gameAreaEl = document.getElementById("gameArea");
const completeEl = document.getElementById("complete");

function availableQuestions() {
  return questionBank
    .map((q, i) => (usedIndexes.has(i) ? null : {q, i}))
    .filter(Boolean);
}

function chooseQuestion() {
  const available = availableQuestions();
  if (!available.length) return null;

  // Prefer questions up to one level above the current level.
  // This keeps the game challenging while still allowing variety.
  const allowed = available.filter(item => item.q.level <= currentLevel + 1);
  const pool = allowed.length ? allowed : available;

  const pick = pool[Math.floor(Math.random() * pool.length)];
  usedIndexes.add(pick.i);
  return pick.q;
}

function newQuestion() {
  currentQuestion = chooseQuestion();
  if (!currentQuestion) {
    showComplete();
    return;
  }

  questionAnswered = false;
  messageEl.textContent = "";
  passageEl.textContent = currentQuestion.passage;
  questionEl.textContent = currentQuestion.question;

  answersEl.innerHTML = "";
  const shuffled = currentQuestion.answers.map((text, index) => ({text, index}))
    .sort(() => Math.random() - 0.5);

  shuffled.forEach(item => {
    const btn = document.createElement("button");
    btn.className = "answer";
    btn.textContent = item.text;
    btn.dataset.originalIndex = item.index;
    btn.onclick = () => checkAnswer(btn, item.index);
    answersEl.appendChild(btn);
  });

  updateDisplay();
}

function checkAnswer(button, answerIndex) {
  if (questionAnswered) return;
  questionAnswered = true;

  const allButtons = [...document.querySelectorAll(".answer")];
  allButtons.forEach(b => b.disabled = true);

  const correct = answerIndex === currentQuestion.correct;

  if (correct) {
    button.classList.add("correct");
    points += POINTS_PER_CORRECT;
    streak++;

    if (currentLevel < 10) currentLevel++;

    messageEl.textContent = "✅ Correct! +50 points — the next question gets harder!";
    updateDisplay();

    if (points >= DAILY_LIMIT) {
      setTimeout(showComplete, 750);
    } else {
      setTimeout(newQuestion, 900);
    }
  } else {
    button.classList.add("wrong");

    allButtons.forEach(b => {
      if (Number(b.dataset.originalIndex) === currentQuestion.correct) {
        b.classList.add("correct");
      }
    });

    streak = 0;
    messageEl.textContent = "❌ Not quite! A new random question is coming...";
    updateDisplay();

    // Wrong answers do not cost points. A different unused question appears.
    setTimeout(newQuestion, 800);
  }
}

function updateDisplay() {
  pointsEl.textContent = points;
  streakEl.textContent = streak;
  countEl.textContent = Math.min(questionsAnswered + 1, TOTAL_QUESTIONS) + " / " + TOTAL_QUESTIONS;
  levelLabelEl.textContent = "Level " + Math.min(currentLevel, 10) + ": " + (questionBank[Math.min(currentLevel,10)-1].title || "Challenge");
  progressBarEl.style.width = Math.min((points / DAILY_LIMIT) * 100, 100) + "%";
  questionsAnswered = usedIndexes.size;
  countEl.textContent = Math.min(questionsAnswered + 1, TOTAL_QUESTIONS) + " / " + TOTAL_QUESTIONS;
}

function showComplete() {
  gameAreaEl.classList.add("hidden");
  completeEl.classList.remove("hidden");
  progressBarEl.style.width = "100%";
}

function resetGame() {
  points = 0;
  streak = 0;
  currentLevel = 1;
  questionsAnswered = 0;
  questionAnswered = false;
  currentQuestion = null;
  usedIndexes = new Set();

  gameAreaEl.classList.remove("hidden");
  completeEl.classList.add("hidden");
  newQuestion();
}

resetGame();
</script>
</body>
</html>
